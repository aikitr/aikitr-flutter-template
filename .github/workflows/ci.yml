name: Flutter CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Analyze, test, and verify template copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localized strings and models
        run: |
          flutter gen-l10n
          dart run build_runner build
      - name: Check generated files are current
        run: |
          git diff --exit-code -- lib/app/localization/generated lib/features/articles/domain lib/features/auth/domain
          test -z "$(git status --porcelain --untracked-files=all -- lib/app/localization/generated lib/features/articles/domain lib/features/auth/domain)"
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --dart-define-from-file=config/dev.json
      - name: Initialize and test a copied project
        run: |
          copy_dir="${RUNNER_TEMP}/weather-template-check"
          dart run tool/initialize_template.dart \
            --target "$copy_dir" \
            --project-name weather_sample \
            --display-name "示例天气" \
            --bundle-id com.example.weather
          if rg -n 'app_template|com\.aikitr\.template|__APP_DISPLAY_NAME__|__APP_BUNDLE_ID__' "$copy_dir"; then
            echo "Template identity placeholders remain in the generated copy."
            exit 1
          fi
          cd "$copy_dir"
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test

  ios-simulator:
    name: iOS Simulator (${{ matrix.flavor }})
    needs: quality
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: dev
            target: lib/main_dev.dart
            config: config/dev.json
          - flavor: staging
            target: lib/main_staging.dart
            config: config/staging.json
          - flavor: prod
            target: lib/main_prod.dart
            config: config/prod.json
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build simulator app
        run: >-
          flutter build ios --simulator --no-codesign
          --flavor "${{ matrix.flavor }}"
          --target "${{ matrix.target }}"
          --dart-define-from-file="${{ matrix.config }}"
      - name: Run dev end-to-end flow on iOS Simulator
        if: matrix.flavor == 'dev'
        run: |
          device_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          if ! xcrun simctl list devices | grep "$device_id" | grep -q Booted; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          flutter test integration_test/app_flow_test.dart \
            --flavor dev \
            --dart-define-from-file=config/dev.json \
            -d "$device_id"
