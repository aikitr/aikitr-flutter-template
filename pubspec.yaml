name: app_template
description: Reusable Flutter iOS application template.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.6'

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  path: ^1.9.1

flutter:
  uses-material-design: false
  generate: true
